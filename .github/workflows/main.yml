---
name: CI

on:
  push:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: "opensafely-core/setup-action@fc0f6e03d1a6fe8c53ff686b310dd08be072b8c8" # v1.9.0
        with:
          install-just: true
          install-uv: true
          cache: uv
      - name: Check formatting, sorting, and linting
        run: just check

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: "opensafely-core/setup-action@fc0f6e03d1a6fe8c53ff686b310dd08be072b8c8" # v1.9.0
        with:
          install-just: true
          install-uv: true
          cache: uv
      - name: Run tests
        run: just test
